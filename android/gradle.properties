org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
org.gradle.cachecleanup=true
# Инкрементальный Kotlin-кеш регулярно бился (Could not close incremental
# caches) на забитом диске — выключаем ради надёжности релизной сборки.
kotlin.incremental=false

org.gradle.daemon=false
